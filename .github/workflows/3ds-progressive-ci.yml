name: 3DS Progressive · Windows build
on:
  push:
    branches:
      - feature/3ds-progressive-ui
    paths:
      - "3DS.Progressive.App/**"
      - "3DS.Progressive.Tests/**"
      - "pk3DS.Core/**"
      - ".github/workflows/3ds-progressive-ci.yml"
  pull_request:
    paths:
      - "3DS.Progressive.App/**"
      - "3DS.Progressive.Tests/**"
      - "pk3DS.Core/**"
      - ".github/workflows/3ds-progressive-ci.yml"

jobs:
  build-wpf:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restaurar 3DS Progressive
        run: dotnet restore .\3DS.Progressive.App\3DS.Progressive.App.csproj -r win-x64
      - name: Compilar 3DS Progressive
        run: dotnet build .\3DS.Progressive.App\3DS.Progressive.App.csproj -c Release -r win-x64 --no-restore
      - name: Regresiones con datos sinteticos XY, ORAS, SM y USUM
        run: dotnet run --project .\3DS.Progressive.Tests\3DS.Progressive.Tests.csproj -c Release
      - name: Publicar version preliminar autocontenida
        run: dotnet publish .\3DS.Progressive.App\3DS.Progressive.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o .\preview-output
      - name: Adjuntar ejecutable de prueba
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Progressive-Preview-win-x64
          path: preview-output/**
          if-no-files-found: error
          retention-days: 14
