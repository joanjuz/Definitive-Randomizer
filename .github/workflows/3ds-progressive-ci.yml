name: 3DS Progressive · Windows build
on:
  push:
    branches:
      - feature/3ds-progressive-ui
      - feature/switch-swsh-prototype
    paths:
      - "3DS.Progressive.App/**"
      - "3DS.Progressive.Tests/**"
      - "pk3DS.Core/**"
      - "native/3ds/nature-mints/**"
      - "docs/contracts/**"
      - "tools/contracts/**"
      - "pk3DS.WinForms/**"
      - "Directory.Build.*"
      - "global.json"
      - "pk3DS.slnx"
      - "custom_balance_templates/moves_gen*.csv"
      - "custom_balance_templates/pokemon_stats_gen7.csv"
      - "plantillas-opcionales/**"
      - ".github/workflows/3ds-progressive-ci.yml"
  pull_request:
    paths:
      - "3DS.Progressive.App/**"
      - "3DS.Progressive.Tests/**"
      - "pk3DS.Core/**"
      - "native/3ds/nature-mints/**"
      - "docs/contracts/**"
      - "tools/contracts/**"
      - "pk3DS.WinForms/**"
      - "Directory.Build.*"
      - "global.json"
      - "pk3DS.slnx"
      - "custom_balance_templates/moves_gen*.csv"
      - "custom_balance_templates/pokemon_stats_gen7.csv"
      - "plantillas-opcionales/**"
      - ".github/workflows/3ds-progressive-ci.yml"

jobs:
  build-wpf:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Preparar registros de validacion
        shell: pwsh
        run: New-Item -ItemType Directory -Force validation-logs | Out-Null
      - name: Restaurar 3DS Progressive
        run: dotnet restore .\3DS.Progressive.App\3DS.Progressive.App.csproj -r win-x64 '-bl:validation-logs/restore-app-{}.binlog'
      - name: Compilar 3DS Progressive
        run: dotnet build .\3DS.Progressive.App\3DS.Progressive.App.csproj -c Release -r win-x64 --no-restore '-bl:validation-logs/build-app-{}.binlog'
      # Tests has a custom executable runner; dotnet test would not run these checks.
      # Keep apphosts enabled: Global/Batch verifies the LegacyBatch executable layout.
      - name: Compilar runner WPF y dependencias WinForms
        run: dotnet build .\3DS.Progressive.Tests\3DS.Progressive.Tests.csproj -c Release -p:UseAppHost=true '-bl:validation-logs/build-tests-{}.binlog'
      - name: Regresiones visuales y de integracion fuera de pantalla
        shell: pwsh
        run: |
          $runner = '.\3DS.Progressive.Tests\bin\Release\net10.0-windows\3DS.Progressive.Tests.dll'
          $suites = @(
            'visual-redesign-only', 'interaction-lock-only', 'requested-ui-only',
            'template-studio-ui-only', 'template-latest-ui-only', 'template-feedback-ui-only',
            'text-classification-ui-only', 'text-commands-ui-only', 'global-options-only',
            'guidance-only', 'global-apply-only', 'rebuild-marts-ui-only', 'mart-layout-ui-only',
            'history-inspection-only', 'transaction-races-only', 'undo-toctou-only', 'undo-template-regression-only', 'rebuild-stability-only', 'swsh-only', 'swsh-ui-only',
            'swsh-parity-only', 'legacy-parity-only', 'nds-only',
            'nds-ui-only', 'nds-events-ui-only', 'nds-map-props-only', 'nds-map-props-ui-only', 'project-detector-only', 'universal-open-only', 'nds-project-format-only', 'nds-project-store-only', 'nds-project-transactions-only', 'nds-project-open-only', 'nds-project-resilience-only', 'usum-mints-only', 'usum-mints-ui-only', 'usum-mint-icons-only', 'usum-mints-distribution-only', 'player-caps-recipe-only', 'stable-polish-only', 'optional-templates-only'
          )
          foreach ($suite in $suites) {
            & dotnet $runner "--$suite" 2>&1 | Tee-Object -FilePath "validation-logs/$suite.log"
            if ($LASTEXITCODE -ne 0) { throw "Runner failed: $suite (exit $LASTEXITCODE)" }
          }
      - name: Verificar fuente y ejecucion ARM de mentas USUM
        shell: pwsh
        run: |
          $mintVenv = Join-Path $env:RUNNER_TEMP 'mint-harness-venv'
          python -m venv $mintVenv
          if ($LASTEXITCODE -ne 0) { throw 'Mint venv failed' }
          $mintPython = Join-Path $mintVenv 'Scripts/python.exe'
          & $mintPython -m pip install -r native/3ds/nature-mints/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Mint harness dependencies failed' }
          & $mintPython native/3ds/nature-mints/generate.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Mint source/template mismatch' }
          dotnet ./3DS.Progressive.Tests/bin/Release/net10.0-windows/3DS.Progressive.Tests.dll --usum-mints-arm-fixtures validation-logs/mints-arm
          if ($LASTEXITCODE -ne 0) { throw 'Mint ARM fixtures failed' }
          & $mintPython native/3ds/nature-mints/verify_arm.py validation-logs/mints-arm
          if ($LASTEXITCODE -ne 0) { throw 'Mint ARM execution failed' }
      # Definitive Game Data contract: JSON Schema, playerLevelCaps status rules and the import service of the
      # published Progressive Tracker 1.4.0 (pinned commit), which must keep accepting the extended examples and
      # the documents the real exporter writes for every playerLevelCaps status (synthetic binaries).
      - name: Contrato Definitive Game Data y compatibilidad con Tracker 1.4.0
        shell: pwsh
        run: |
          $tracker = Join-Path $env:RUNNER_TEMP 'tracker-v1.4.0'
          git clone --quiet --depth 1 --branch v1.4.0 https://github.com/joanjuz/NuzlockeTracker.git $tracker
          if ($LASTEXITCODE -ne 0) { throw 'Tracker 1.4.0 checkout failed' }
          $commit = git -C $tracker rev-parse HEAD
          if ($commit -ne '146cc26d52edbf3ab4024af8197eb5fe6fa6d1f6') { throw "Tracker v1.4.0 points to $commit" }
          $contractVenv = Join-Path $env:RUNNER_TEMP 'contract-venv'
          python -m venv $contractVenv
          if ($LASTEXITCODE -ne 0) { throw 'Contract venv failed' }
          $contractPython = Join-Path $contractVenv 'Scripts/python.exe'
          & $contractPython -m pip install --only-binary=:all: -r tools/contracts/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Contract dependencies failed' }
          $capsFixtures = Join-Path $env:RUNNER_TEMP 'dgd-caps-fixtures'
          dotnet ./3DS.Progressive.Tests/bin/Release/net10.0-windows/3DS.Progressive.Tests.dll --definitive-game-data-caps-fixtures $capsFixtures
          if ($LASTEXITCODE -ne 0) { throw 'playerLevelCaps fixtures failed' }
          # Progressive Tracker with the level-caps proposal (pinned commit): the exported documents go through its
          # import service and proposal flow, and Tracker 1.4.0 must open the run folders that version writes.
          $consumer = Join-Path $env:RUNNER_TEMP 'tracker-level-caps-proposal'
          git clone --quiet https://github.com/joanjuz/NuzlockeTracker.git $consumer
          if ($LASTEXITCODE -ne 0) { throw 'Tracker checkout failed' }
          git -C $consumer checkout --quiet --detach f42b5d676c5389d8f040293851d36a83d063b845
          if ($LASTEXITCODE -ne 0) { throw 'Tracker consumer commit not found' }
          & $contractPython -I tools/contracts/check_definitive_game_data.py --tracker $tracker --producer $capsFixtures --consumer $consumer 2>&1 | Tee-Object -FilePath validation-logs/dgd-contract.log
          if ($LASTEXITCODE -ne 0) { throw 'Definitive Game Data contract checks failed' }
      - name: Regresiones con datos sinteticos XY, ORAS, SM y USUM
        env:
          PROGRESSIVE_UI_CAPTURE_DIR: ${{ github.workspace }}/ui-captures
        run: dotnet .\3DS.Progressive.Tests\bin\Release\net10.0-windows\3DS.Progressive.Tests.dll --synthetic-only
      # Every view of the four 3DS families at four logical sizes: overlaps, clipped or unreadable text, light system
      # surfaces. Its issues.txt and warnings.txt go into the validation-logs artifact (the PNG captures stay local).
      - name: Auditoria visual de todas las vistas 3DS
        shell: pwsh
        run: |
          dotnet .\3DS.Progressive.Tests\bin\Release\net10.0-windows\3DS.Progressive.Tests.dll --visual-audit validation-logs/visual-audit 2>&1 | Tee-Object -FilePath validation-logs/visual-audit.log
          $code = $LASTEXITCODE
          Remove-Item validation-logs/visual-audit/*.png -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw "Visual audit failed (exit $code)" }
      - name: Capturas de las comprobaciones WPF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Progressive-UI-checks
          path: |
            ui-captures/*.png
            3DS.Progressive.Tests/bin/Release/net10.0-windows/visual-redesign/*.png
            validation-logs/**
          if-no-files-found: warn
          retention-days: 14
      - name: Preparar motor de video y fuentes verificadas
        shell: pwsh
        run: .\3DS.Progressive.App\Tools\Mobipeg\Preparar-Mobipeg.ps1
      - name: Publicar version preliminar autocontenida
        run: dotnet publish .\3DS.Progressive.App\3DS.Progressive.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o .\preview-output '-bl:validation-logs/publish-app-{}.binlog'
      - name: Publicar motor original Gen7 para Batch ROM Builder
        run: |
          dotnet publish .\pk3DS.WinForms\pk3DS.WinForms.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o .\preview-output\LegacyBatch '-bl:validation-logs/publish-legacy-{}.binlog'
          New-Item -ItemType Directory -Force .\preview-output\LegacyBatch\custom_balance_templates | Out-Null
          Copy-Item .\custom_balance_templates\moves_gen*.csv .\preview-output\LegacyBatch\custom_balance_templates\
          Copy-Item .\custom_balance_templates\evolutions_gen*.csv .\preview-output\LegacyBatch\custom_balance_templates\
          Copy-Item .\custom_balance_templates\pokemon_stats_gen7.csv .\preview-output\LegacyBatch\custom_balance_templates\
          Copy-Item .\preview-output\LegacyBatch\custom_balance_templates\* .\preview-output\custom_balance_templates\ -Force
          Copy-Item .\pk3DS.WinForms\Templates\field_items.txt .\preview-output\custom_balance_templates\field_items.txt
          if (!(Test-Path .\preview-output\custom_balance_templates\field_items.txt)) {
            throw 'Packaged preview must contain field_items.txt at the shared root'
          }
      - name: Adjuntar ejecutable de prueba
        uses: actions/upload-artifact@v4
        with:
          name: 3DS-Progressive-Preview-win-x64
          path: preview-output/**
          if-no-files-found: error
          retention-days: 14
